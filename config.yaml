# Signal Engine configuration.
# Everything the system's behaviour depends on lives here or in data/taxonomy.yaml.
# No company names, signal types or weights are hardcoded in the application.
#
# Edit this file and restart (Ctrl-C then ./run.sh) to apply.

# ---------------------------------------------------------------------------
# Identity — who is using this instance
# ---------------------------------------------------------------------------
user:
  name: "Me"                  # shown on the dashboard, stored in created_by fields
  tenant_id: 1                # multi-tenant hook; leave at 1 for single-user

# ---------------------------------------------------------------------------
# Products — referenced by product_fit throughout. Rename freely.
# ---------------------------------------------------------------------------
products:
  A:
    code: FDM
    name: "Freeze-drying microscope"
    buyers: >
      Formulation scientists, drug product scientists, lyophilisation specialists
      and MSAT teams at pharma companies and CDMOs.
  B:
    code: LBP
    name: "Lyobead generator"
    buyers: >
      Assay development and reagent scientists at diagnostics companies,
      from startups to large IVD manufacturers.

# ---------------------------------------------------------------------------
# Scoring
# ---------------------------------------------------------------------------
scoring:
  # Slow decay. Capital equipment cycles run 6 months to 2 years; a six-month-old
  # signal is NOT dead. A signal never falls to zero.
  decay:
    rate_per_quarter: 0.90    # retain 90% of weight each quarter
    floor: 0.40               # never fall below 40% of base weight
    days_per_quarter: 91.31

    # A signal with an expiry_date set drops straight to the floor once passed,
    # rather than gliding there. Signals with no expiry_date just decay normally.
    # It never drops to zero — see finding 2 in the brief.
    expiry_drops_to_floor: true

  # Compounding. Two independent signals close together mean more than the sum:
  # observed pattern is regulatory submission -> funding -> authorisation in 7 months.
  compounding:
    window_days: 90
    multiplier: 1.30
    require_distinct_types: true   # two signals of the same type do not compound
    stack: false                   # true would apply the multiplier per extra cluster

  # Tier thresholds, evaluated top-down on the final compounded score.
  # Tier A/B companies are what "signal quality" in the Buddy Score rewards, so
  # these thresholds decide what counts as legitimate outreach.
  #
  # CALIBRATION RULE: the B threshold must be at or below the heaviest weight in
  # your taxonomy (currently 30). Otherwise no single signal can ever reach Tier B,
  # the highest-converting signal in the taxonomy scores as low-quality outreach,
  # and the Buddy Score punishes you for acting on it. tests/test_scoring.py has a
  # guard for this — if you raise a threshold or lower a weight, it will tell you.
  #
  #   A  a compounding cluster, or three signals: contact this week
  #   B  one heavy signal alone, or several light ones: worth working
  #   C  one moderate signal: monitor
  #   D  faint traces only
  tiers:
    - {name: A, min_score: 55}
    - {name: B, min_score: 25}
    - {name: C, min_score: 12}
    - {name: D, min_score: 0}

  # Confidence below this lands an AUTO-detected signal in the review queue instead
  # of scoring it. "I'd rather confirm 10 real signals than be handed 100 uncertain ones."
  auto_review_threshold: 0.70

  # Manually entered signals face a much lower bar — you were there, you saw it.
  # Only genuinely ambiguous notes get held back for you to confirm.
  manual_review_threshold: 0.45
  manual_default_confidence: 0.90

  # Confidence gates whether a signal scores at all (above). Set this true to ALSO
  # scale its weight by confidence. Off by default so a confirmed signal is not
  # penalised twice for having once been uncertain.
  confidence_scales_weight: false

# ---------------------------------------------------------------------------
# Buddy Score — leading indicator of pipeline health, 0-100.
# Components must sum to 100.
# ---------------------------------------------------------------------------
buddy_score:
  components:
    progression: 30      # replies -> conversations -> meetings booked
    signal_quality: 25   # % of outreach going to Tier A/B companies
    volume: 25           # touches against your own target
    consistency: 20      # active days, no gaps — steady beats bursts

  # Volume target. Set deliberately low: this system trades touch count for
  # research depth. Manual person-research is the bottleneck and that is by design.
  weekly_touch_target: 15

  # Consistency: how many distinct days per week you want to be active.
  weekly_active_day_target: 4

  # Progression: conversion rates that would earn full marks.
  # Meetings are the terminal metric — cycles are far too long for orders to be
  # usable feedback.
  target_reply_rate: 0.15
  target_conversation_rate: 0.08
  target_meeting_rate: 0.05

  # Which tiers count as "quality" outreach for the signal_quality component.
  quality_tiers: [A, B]

  # Trend direction is computed against this many prior periods.
  trend_lookback_periods: 4

# ---------------------------------------------------------------------------
# Language model
# ---------------------------------------------------------------------------
# Requires ANTHROPIC_API_KEY in the environment (or a .env file next to this one).
llm:
  # OFF by default, and deliberately not keyed on "is there an API key lying around".
  # A leftover key — expired, out of credits, belonging to another project — must
  # never silently re-enable a paid code path. Turn parsing on explicitly:
  #   1. uv pip install -e ".[llm]"
  #   2. put ANTHROPIC_API_KEY=... in .env
  #   3. set this to true
  # The app is fully functional with this false; signals are entered on a form.
  enabled: false

  # Parsing a note into a structured signal is cheap extraction work.
  parser_model: "claude-sonnet-4-6"
  parser_effort: low          # low | medium | high | max — null disables thinking

  # The coach reasons over your whole pipeline — worth the better model.
  # (Coach ships in a later phase; the setting is read when it does.)
  coach_model: "claude-opus-5"
  coach_effort: high

  max_tokens: 4000
  timeout_seconds: 120

  # If the API is unreachable or the key is missing, manual entry still works —
  # notes are stored raw and flagged unparsed rather than lost.
  fail_soft: true

# ---------------------------------------------------------------------------
# Automated signal detection (phase 10)
# ---------------------------------------------------------------------------
# Public sources only. No API key, no licensed data, no enrichment vendor.
# Run it with:  ./run.sh detect          (or .\run.ps1 detect on Windows)
#
# Everything found is written with source=auto and a link back to where it came
# from. Anything below scoring.auto_review_threshold lands in the review queue
# instead of scoring — you approve or reject it.
detection:
  # Be polite to free public APIs. Seconds between requests, per source.
  request_delay_seconds: 0.5
  timeout_seconds: 30
  user_agent: "SignalEngine/0.1 (capital instrument sales signal monitor)"

  # How far back to look when you don't pass --since.
  default_lookback_days: 90

  # BACKFILL (`detect --backfill`) — the first-run sweep. Capital cycles run 6
  # months to 2 years, so a signal from 20 months ago is still live: it decays to
  # the floor, it does not disappear. 24 months is the whole cycle.
  # Note: only openFDA and MHRA hold dated history. Google News RSS returns recent
  # items only and EUDAMED publishes no dates, so a backfill deepens the dated
  # regulatory sources, not the press.
  backfill_months: 24

  # DISCOVERY finds companies not already in your database. Off by default: it is
  # far noisier, and everything it finds is a company you have never assessed.
  # Turn on here, or per-run with --discover.
  discovery:
    enabled: false
    max_new_companies_per_run: 25

  # One event, reported by three outlets, is one signal. Sources that issue a
  # unique record ID per event (a K-number, a EUDAMED UUID) are exempt — two
  # clearances in the same week are genuinely two events. Sources without one
  # (the press) collapse to a single signal per company, per type, per window.
  duplicate_event_window_days: 14

  # Company-name matching. Detected records name a company in free text; we have
  # to decide whether that is one of yours.
  matching:
    # Exact match after normalising case and legal suffixes (Ltd, Inc, GmbH...).
    exact_confidence: 0.92
    # One name contains the other, e.g. "Northwind" vs "Northwind Diagnostics".
    # Deliberately below auto_review_threshold, so these always go to review.
    partial_confidence: 0.60
    min_name_length: 5   # don't match on short/generic names

  sources:
    openfda:
      enabled: true
      # 510(k) clearances and De Novo authorisations.
      endpoints:
        - {name: "510(k)", url: "https://api.fda.gov/device/510k.json", type_key: regulatory_submission}
        - {name: "De Novo", url: "https://api.fda.gov/device/registrationlisting.json", type_key: regulatory_submission}
      # A 24-month backfill on a large filer can exceed this; the run says so when
      # it happens rather than silently truncating.
      max_results_per_company: 50
      # Discovery mode only: device-name keywords worth surfacing.
      discovery_keywords: ["lyophilized", "lyophilised", "freeze-dried", "reagent bead"]

    # EU device registrations. Free, no key. Covers MDR and IVDR devices, which is
    # where most of this market actually files — openFDA cannot see any of them.
    # NOTE: EUDAMED publishes no registration date on these records, so this is a
    # STANDING FACT ("they have N devices on the EU market"), not a dated event.
    # It is therefore pinned below the auto bar and always reaches you for review,
    # and it collapses to one signal per company rather than one per device.
    eudamed:
      enabled: true
      url: "https://ec.europa.eu/tools/eudamed/api/devices/udiDiData"
      type_key: regulatory_submission
      max_results_per_company: 50
      base_confidence: 0.65
      # EUDAMED pages a 3-million-row table; 30s times out more often than not.
      timeout_seconds: 90

    # UK device registrations (MHRA Public Access Registration Database). Free,
    # no key. POST endpoint behind the public search page. Unlike EUDAMED these
    # records carry a registration date, so they behave as dated events.
    mhra:
      enabled: true
      url: "https://pard.mhra.gov.uk/searchManufacturers"
      type_key: regulatory_submission
      max_results_per_company: 25
      base_confidence: 0.90

    news:
      enabled: true
      # Google News RSS. Public feed, no key, no scraping of the articles themselves.
      url: "https://news.google.com/rss/search"
      language: "en-US"
      country: "US"
      max_items_per_company: 10
      # Headlines are weak evidence, so news never clears the auto bar on its own.
      base_confidence: 0.55

  # Keyword -> signal type. A headline must contain one of these to become a
  # signal of that type. Editable data: add your own phrasing as you learn it.
  keywords:
    new_lyo_capacity:
      ["fill-finish", "fill finish", "lyophilization capacity", "lyophilisation capacity",
       "freeze dryer", "freeze-dryer", "sterile injectable", "aseptic facility",
       # Added after checking against companies that actually converted: they
       # announce capacity in contract-manufacturing language, not lyo language.
       "cdmo", "contract manufacturing", "contract manufacturer", "manufacturing capacity",
       "scalable manufacturing", "scale up manufacturing", "manufacturing scale-up",
       "new production line"]
    regulatory_submission:
      ["510(k)", "de novo", "fda clearance", "fda clearing", "ce-ivdr", "ivdr", "eua"]
    assay_kit_panel_launch:
      ["launches assay", "new assay", "test kit", "multiplex panel", "diagnostic panel",
       "pcr panel", "pcr test", "launches diagnostic", "new diagnostic",
       "next-generation diagnostic", "diagnostic innovations"]
    funding_scale_up:
      # "scale up manufacturing" moved to new_lyo_capacity — it describes capacity,
      # not money, and funding is a qualifier rather than a trigger.
      ["series a", "series b", "series c", "raises", "funding round"]
    grant_award:
      # No grants source is fetched any more (SBIR was US-only and permanently
      # down); these still classify press coverage of a grant.
      ["sbir", "sttr", "innovate uk", "horizon europe", "grant award", "awarded a grant"]
    iso13485_facility_expansion:
      ["iso 13485", "cleanroom", "clean room", "facility expansion", "new facility"]
    phase_1_parenteral:
      ["phase 1 trial", "phase i trial", "first-in-human", "investigational new drug"]
    publication_stability_lyo:
      ["reagent stability", "ambient stable", "cold chain free", "lyophilization study"]
    conference_presentation:
      ["to present at", "exhibiting at", "poster at", "keynote at"]

# ---------------------------------------------------------------------------
# ICP — who is worth researching, as opposed to who has fired a signal.
#
# This is a DIRECTORY, not a queue. Nothing here is ranked and nothing here can
# reach the priority queue: fit describes what a company IS, and only a signal —
# what it DID — earns pipeline entry. Directory entries live in their own table
# so no report can accidentally blend the two.
#
# Every field below is one customer's configuration. A customer selling
# chromatography columns changes this block and nothing else.
# ---------------------------------------------------------------------------
icp:
  # REGIONS — the axis you actually work by. Four working lists plus a catch-all,
  # so no single tab gets crowded.
  #
  # Applied to the signalled queue and the research directory SEPARATELY. Regions
  # slice each list; they never merge the two. A company with a signal and a
  # company that merely fits are still different things in the same region.
  #
  # Region membership is not the same as which territories get swept — see
  # `territories` / `exclude_territories` below. You can hold China in the Asia
  # region while excluding it from sweeps.
  #
  # The catch-all region also holds companies whose country is unknown, so that
  # nothing is ever unreachable. The row itself still shows "unknown" rather than
  # claiming a location.
  regions:
    - name: "US"
      countries: ["US"]
    - name: "EU"
      countries: ["AT", "BE", "BG", "HR", "CY", "CZ", "DK", "EE", "FI", "FR", "DE",
                  "GR", "EL", "HU", "IE", "IT", "LV", "LT", "LU", "MT", "NL", "PL",
                  "PT", "RO", "SK", "SI", "ES", "SE",
                  "NO", "IS", "LI", "CH"]        # EEA + Switzerland
    - name: "UK"
      countries: ["GB"]
    - name: "Asia"
      countries: ["CN", "JP", "KR", "TW", "HK", "MO", "SG", "MY", "TH", "VN", "ID",
                  "PH", "IN", "PK", "BD", "LK", "NP", "KH", "LA", "MM", "MN", "BN",
                  "KZ", "KG", "UZ", "TJ", "TM"]
    - name: "Rest of world"
      countries: []
      catch_all: true

  # Which registers to build the directory from, and how far to walk them.
  sources: ["eudamed", "mhra", "openfda"]

  # US (and elsewhere) device registrations via openFDA registration & listing.
  # Parts 862 / 864 / 866 of 21 CFR are exactly the in-vitro diagnostic parts —
  # clinical chemistry, haematology & pathology, immunology & microbiology — so
  # they do the job here that IVDR risk class does in EUDAMED.
  #
  # Unlike EUDAMED this endpoint has a working country filter, so the sweep asks
  # for the territories you want instead of walking everything and discarding it.
  openfda:
    enabled: true
    url: "https://api.fda.gov/device/registrationlisting.json"
    ivd_regulation_parts: ["862", "864", "866"]
    page_size: 100
    max_pages_per_part: 20

    # The register also lists repackagers, importers, exporters and complaint-file
    # addresses — a first pass returned DHL Supply Chain and a dental alloy maker.
    # These fragments are matched against `establishment_type`; a row matching none
    # of them is not somebody who makes diagnostics.
    #
    # "Develop Specifications" is deliberately included: a company that designs an
    # assay and has it built elsewhere is exactly the buyer, not a false positive.
    # A row with NO establishment type is kept — unknown is not grounds to exclude.
    establishment_types:
      - "Manufacture Medical Device"
      - "Contract Manufacturer"
      - "Develop Specifications"

    # TRUE SIZE, via one extra query per owner. openFDA will report how many
    # listings an OWNER/OPERATOR holds, which is the only figure here that tracks
    # corporate scale — a registration number counts one site, so a multi-site
    # giant fragments into many small-looking establishments.
    #
    #   Stryker Puerto Rico   67 listings at its site   ->  3364 under its owner
    #   TECO Diagnostics     190 listings at its site   ->   207 under its owner
    #
    # Per site, the giant looks SMALLER than the SME. Per owner, they separate.
    fetch_true_counts: true
    max_count_lookups: 400

    # Calibrated against real owners, measured 2026-09:
    #   Medtronic 5123 | Stryker 3364 | Cook 791 | Zimmer 720 | Penumbra 349
    #   Bio-Rad 342  ||  TECO Diagnostics 207 | High Technology 64 | COGMEDIX 24
    #   Immundiagnostik 10 | MEDRX 3
    # Everything you'd want sits at or below 207; everything you wouldn't starts
    # at 342. The large threshold goes between them.
    #
    # These are LISTING counts and a separate scale from icp.size_bands, which
    # counts EUDAMED devices. Don't merge the two tables.
    size_bands:
      - {name: "micro",  max_listings: 10}
      - {name: "small",  max_listings: 75}
      - {name: "medium", max_listings: 250}
      - {name: "large",  max_listings: null}
  page_size: 20            # EUDAMED caps its page at 20 whatever we ask for
  max_pages_per_class: 150 # per risk class; raise for a deeper sweep, it's slower

  # THE ICP FILTER, and the reason this returns anything at all. EUDAMED has no
  # country, legislation or category filter that works — but risk class does, and
  # IVDR devices are classified A/B/C/D where MDR devices are I/IIa/IIb/III. So
  # asking for these classes IS asking for in-vitro diagnostics.
  #
  # Class A is excluded by default: it is mostly buffers, stabilisers and
  # specimen receptacles rather than the assays and kits you sell into.
  eudamed_risk_classes: ["class-b", "class-c", "class-d"]

  # Trade-name keyword search, run in ADDITION to the risk-class sweep. This is a
  # weak net on its own — EUDAMED matches literal trade names, and trade names are
  # brand names, so "lateral flow" finds almost nothing. Kept because it labels
  # entries with what they make, which is what you filter on afterwards.
  max_pages_per_keyword: 8

  # Territories worth researching. ISO-3166 alpha-2, matched against the EUDAMED
  # SRN prefix and the MHRA country field.
  #
  # EMPTY = EVERY TERRITORY, which is the default because it is the only one that
  # isn't a guess about someone's business. Narrow it only if the customer has
  # actually said they don't sell somewhere. Note that EUDAMED skews heavily to
  # Chinese manufacturers, so leaving this open makes for a much larger directory
  # — filter per-search on the Directory page rather than pre-filtering here.
  territories: []

  # Territories to leave OUT, which is the useful knob when you sell nearly
  # everywhere. Applied after `territories`, so it works with an empty allow-list.
  # A company whose country is unknown is NEVER excluded here — absence of
  # evidence is not evidence that it's somewhere you don't sell.
  exclude_territories: []

  # Device-name keywords that say "this company develops assays or test kits".
  # These drive the register searches AND get recorded per entry so you can
  # filter on them afterwards.
  device_keywords:
    - "assay"
    - "test kit"
    - "reagent"
    - "immunoassay"
    - "pcr"
    - "lateral flow"
    - "elisa"
    - "diagnostic kit"
    - "molecular test"

  # Size is inferred, coarsely, from how many devices a manufacturer has on the
  # register — it is the only size proxy these registers offer. Anything outside
  # these bands stays NULL and displays as "unknown", never as zero.
  size_bands:
    - {name: "micro",  max_devices: 5}
    - {name: "small",  max_devices: 25}
    - {name: "medium", max_devices: 150}
    - {name: "large",  max_devices: null}   # null = no upper bound

  # Bands considered in-ICP. "large" is deliberately absent: the brief's finding
  # was that cold outbound to large corporates without a signal went silent.
  # "unknown" is included — absence of evidence must not exclude a company.
  target_size_bands: ["micro", "small", "medium", "unknown"]

  # How many entries the directory page shows at once.
  page_size_display: 50

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  host: "127.0.0.1"
  port: 8420
  open_browser: true

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
database:
  # SQLite for v1. To move to Postgres, change this one line to e.g.
  #   url: "postgresql+psycopg://user:pass@localhost/signal_engine"
  # and run ./run.sh migrate. No application code changes.
  url: "sqlite:///data/signal_engine.db"
