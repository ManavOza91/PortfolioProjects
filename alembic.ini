[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The database URL is supplied at runtime by alembic/env.py from config.yaml,
# so that changing config.yaml (or SIGNAL_ENGINE_DATABASE_URL) is the only place
# the connection is defined.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# WARN, not INFO — a non-developer running ./run.sh should not be shown
# migration chatter on every start. Set to INFO when debugging migrations.
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
