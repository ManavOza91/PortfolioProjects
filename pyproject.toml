[project]
name = "signal-engine"
version = "0.1.0"
description = "Signal-driven outbound engine for capital scientific instrument sales"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
signal-engine = "signal_engine.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

# Optional. The app is fully functional without this — signals are entered on a
# form. Install it only if you want free-text notes parsed into signals:
#   uv pip install -e ".[llm]"      (or ./run.sh enable-parser)
llm = ["anthropic>=0.69"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
